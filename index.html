<!doctype html><html lang='ar' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.webmanifest'><title>Europe 2026</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f5f6f8;color:#111827}header{background:#111827;color:#fff;padding:18px;position:sticky;top:0}main{max-width:850px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:10px 0}.muted{color:#6b7280;font-size:13px}.ok{color:#166534}.warn{color:#92400e}button,input,select,textarea{font:inherit}button{padding:11px 13px;border:0;border-radius:11px;background:#111827;color:#fff;margin:3px}.soft{background:#e5e7eb;color:#111827}.row{display:flex;gap:6px;flex-wrap:wrap}.day{border-right:5px solid #d1d5db}.done{border-right-color:#22c55e}.current{border-right-color:#f59e0b}.booking{border-right:4px solid #111827;padding-right:10px;margin-top:9px}dialog{width:min(520px,94%);border:0;border-radius:18px;padding:18px}label{display:block;font-size:13px;font-weight:700;margin-top:8px}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin-top:4px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center}nav button{background:white;color:#111827;flex:1;max-width:220px;min-height:58px}.hide{display:none}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef2ff;font-size:12px}</style></head><body>
<header><b>مساعد رحلتي — Europe 2026</b><div id='headline' class='muted' style='color:#d1d5db'></div></header><main>
<section id='home'><div class='card'><div class='muted'>الخطوة التالية</div><h2 id='nextTitle'>الاستعداد للرحلة</h2><div id='nextText'></div><div class='row' style='margin-top:10px'><button id='locate'>📍 تحقق من موقعي</button><button class='soft' id='manualDone'>✓ وصلت/أنجزت</button></div><div id='locmsg' class='muted'></div></div><div class='card'><b>الحجوزات المؤكدة</b><div id='summary'></div></div></section>
<section id='plan' class='hide'><h2>الخطة يومًا بيوم</h2><div id='days'></div></section>
<section id='bookings' class='hide'><div class='row'><h2 style='flex:1'>الحجوزات</h2><button id='addBooking'>+ إضافة</button></div><div id='bookingList'></div></section>
<section id='profile' class='hide'><h2>بياناتي</h2><div class='card'><div class='muted'>تحفظ محليًا على جهازك. لا تدخل CVV أو رقم بطاقة كامل.</div><label>الاسم كما في الجواز</label><input id='name'><label>الهاتف</label><input id='phone'><label>البريد</label><input id='email'><label>رقم الجواز</label><input id='passport' type='password'><label>جهة اتصال للطوارئ</label><input id='emergency'><button id='saveProfile'>حفظ</button></div><div class='card'><b>النسخة الاحتياطية</b><div class='row'><button id='exportBtn' class='soft'>تصدير JSON</button><label style='display:inline-block'><span class='pill'>استرجاع</span><input id='importFile' type='file' accept='.json' style='display:none'></label></div></div></section>
</main><nav><button data-v='home'>🏠<br>الآن</button><button data-v='plan'>📅<br>الخطة</button><button data-v='bookings'>🎫<br>الحجوزات</button><button data-v='profile'>👤<br>بياناتي</button></nav>
<dialog id='dlg'><form id='bookingForm'><h3>حجز</h3><input type='hidden' id='editId'><label>التاريخ</label><select id='date'></select><label>النوع</label><select id='type'><option>فندق</option><option>طيران</option><option>قطار</option><option>سيارة</option><option>تذكرة/معلم</option><option>أخرى</option></select><label>الاسم</label><input id='bname' required><label>الوقت</label><input id='time'><label>السعر</label><input id='price' inputmode='decimal'><label>العملة</label><select id='currency'><option>EUR</option><option>CHF</option><option>USD</option><option>LYD</option><option>TND</option></select><label>الحالة</label><select id='status'><option>غير محجوز</option><option>محجوز - غير مدفوع</option><option>مدفوع ومؤكد</option></select><label>رقم التأكيد</label><input id='confirm'><label>رابط التذكرة</label><input id='ticket' type='url'><label>خط العرض للنقطة (اختياري)</label><input id='lat' inputmode='decimal'><label>خط الطول (اختياري)</label><input id='lon' inputmode='decimal'><label>نطاق الوصول بالمتر</label><input id='radius' inputmode='numeric' value='500'><label>ملاحظات</label><textarea id='notes'></textarea><div class='row'><button type='submit'>حفظ</button><button type='button' class='soft' id='cancel'>إلغاء</button></div></form></dialog>
<script src='app.js'></script></body></html>
